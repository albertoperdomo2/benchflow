apiVersion: benchflow.io/v1alpha1
kind: MetricsProfile
metadata:
  name: kv-cache-comparison
spec:
  prometheus_url: https://thanos-querier.openshift-monitoring.svc:9091
  query_step: 15s
  query_timeout: 30s
  verify_tls: false
  queries:
    prompt_tokens_by_source: >-
      {__name__=~"(vllm|kserve_vllm):prompt_tokens_by_source_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    kv_cache_usage: >-
      {__name__=~"(vllm|kserve_vllm):(kv_cache_usage_perc|gpu_cache_usage_perc)", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    model_cpu_seconds: >-
      container_cpu_usage_seconds_total{namespace="$namespace", pod=~"$modelserver_pod_regex", container!="", container!="POD"}
    model_memory_bytes: >-
      container_memory_working_set_bytes{namespace="$namespace", pod=~"$modelserver_pod_regex", container!="", container!="POD"}
    lmcache_cpu_seconds: >-
      container_cpu_usage_seconds_total{namespace="$namespace", pod=~"benchflow-lmcache-.*", container="lmcache-server"}
    lmcache_memory_bytes: >-
      container_memory_working_set_bytes{namespace="$namespace", pod=~"benchflow-lmcache-.*", container="lmcache-server"}
    model_gpu_memory_bytes: >-
      DCGM_FI_DEV_FB_USED{exported_namespace="$namespace", exported_pod=~"$modelserver_pod_regex"} * 1048576
    requests_running: >-
      {__name__=~"(vllm|kserve_vllm):num_requests_running", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    requests_waiting: >-
      {__name__=~"(vllm|kserve_vllm):num_requests_waiting", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    requests_success: >-
      {__name__=~"(vllm|kserve_vllm):request_success_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    generation_tokens: >-
      {__name__=~"(vllm|kserve_vllm):generation_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}
    kv_offload_bytes_total_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_bytes_rate_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_time_rate_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    ttft_p50_seconds: >-
      histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    ttft_p90_seconds: >-
      histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    ttft_p99_seconds: >-
      histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    e2e_request_latency_p50_seconds: >-
      histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    e2e_request_latency_p90_seconds: >-
      histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    e2e_request_latency_p99_seconds: >-
      histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    lmcache_l1_read_chunks_total: >-
      lmcache_mp_l1_read_chunks_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_l1_write_chunks_total: >-
      lmcache_mp_l1_write_chunks_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_l1_evicted_chunks_total: >-
      lmcache_mp_l1_evicted_chunks_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_chunks_loaded_total: >-
      lmcache_mp_num_chunks_loaded_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_transfer_phase_bytes_total: >-
      lmcache_mp_transfer_phase_bytes_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_finished_stores_total: >-
      lmcache_mp_num_finished_stores_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
    lmcache_finished_retrieves_total: >-
      lmcache_mp_num_finished_retrieves_total{namespace="$namespace", pod=~"benchflow-lmcache-.*"}
