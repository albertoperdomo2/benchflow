apiVersion: benchflow.io/v1alpha1
kind: MetricsProfile
metadata:
  name: epp-tracing-one-percent
spec:
  prometheus_url: https://thanos-querier.openshift-monitoring.svc:9091
  query_step: 10s
  query_timeout: 30s
  verify_tls: false
  tracing:
    mode: standard
    sample_ratio: 0.01
  queries:
    epp_request_rate: rate(llm_d_epp_request_total{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])
    epp_cpu_cores: sum by (pod) (rate(process_cpu_seconds_total{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m]))
    epp_cpu_throttling_ratio: sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="$namespace", pod=~"$scheduler_pod_regex", container="epp"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="$namespace", pod=~"$scheduler_pod_regex", container="epp"}[5m])), 1)
    epp_memory_working_set_bytes: container_memory_working_set_bytes{namespace="$namespace", pod=~"$scheduler_pod_regex", container="epp"}
    epp_scheduler_p50_seconds: histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_scheduler_p95_seconds: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_scheduler_p99_seconds: histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_scheduler_e2e_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_request_processing_p50_seconds: histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_request_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_request_processing_p95_seconds: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_request_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_request_processing_p99_seconds: histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_request_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_response_processing_p50_seconds: histogram_quantile(0.5, sum by (le) (rate(llm_d_epp_response_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_response_processing_p95_seconds: histogram_quantile(0.95, sum by (le) (rate(llm_d_epp_response_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
    epp_response_processing_p99_seconds: histogram_quantile(0.99, sum by (le) (rate(llm_d_epp_response_processing_duration_seconds_bucket{namespace="$namespace", pod=~"$scheduler_pod_regex"}[1m])))
