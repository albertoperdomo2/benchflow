    kv_offload_cpu_cache_speculative_reserve_blocks_by_engine: max by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_speculative_reserve_blocks", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_cpu_cache_speculative_reserve_free_blocks_by_engine: max by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_speculative_reserve_free_blocks", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    # Reserved blocks consumed by critical demand, in BLOCKS per second so the
    # magnitude is readable: a one-block dip and an erosion of the whole
    # prefetch budget are different events. The gauges above show a shortfall
    # but not its cause -- the bounded-reserve run had to infer the borrow from
    # free=0 while reserve_free=64. A rising rate here with free_blocks below
    # the reserve means demand pressure, not a prefetch bug, is the cause.
    kv_offload_cpu_cache_reserve_borrowed_blocks_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_reserve_borrowed_blocks_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    # Acceptance gate for the live cell: free blocks must stay at or above the
    # configured reserve after warmup. min() rather than sum() so a single
    # starved CPU manager cannot be masked by a healthy one.
    #
    # The absolute CPU block gauges above use max() for the same reason: the
    # exporter emits two series per CPU manager, so sum() reported a 1,024-
    # block reserve for a configured 512 and doubled the free-block count.
    # These gauges are per-manager state, not additive quantities -- summing
    # them was always wrong, it only became visible once the reserve gave the
    # value a known ground truth to disagree with.
    kv_offload_cpu_cache_min_free_blocks_by_engine: min by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_free_blocks", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    # Retention lease: blocks currently held against ordinary persistence, and
    # blocks whose lease demand-critical pressure had to break.
    kv_offload_cpu_cache_speculative_leased_blocks_by_engine: max by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_speculative_leased_blocks", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_cpu_cache_speculative_lease_reclaimed_blocks_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_cache_speculative_lease_reclaimed_blocks_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    # Waste attributed to persistence reclaiming a promotion before demand --
    # a subset of prefetch_wasted. This is the number that validates or
    # falsifies the retention lease: if waste stays high but this stays low,
    # retention is not the remaining problem.
    # NOT every pre-demand eviction: a promotion displaced by a *later*
    # speculative promotion is wasted but not counted here. Check
    # speculative_reserve_free_blocks reaching zero for that case, and the
    # lead-time histograms for demand simply never arriving.
    kv_offload_tiering_prefetch_evicted_before_demand_rate_by_engine: sum by (pod, engine, tier) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_prefetch_evicted_before_demand_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_cpu_allocation_size_p90_blocks_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_cpu_allocation_size_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_allocation_failures_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_allocation_failure_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_stores_skipped_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_stores_skipped_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    external_prefix_cache_hit_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):external_prefix_cache_hits(_total)?", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):external_prefix_cache_queries(_total)?", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 1)
    external_kv_transfer_prompt_token_share_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):prompt_tokens_by_source_total", namespace="$namespace", pod=~"$modelserver_pod_regex", source="external_kv_transfer"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):prompt_tokens_by_source_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 1)
    kv_block_lifetime_p50_seconds_by_pod: histogram_quantile(0.5, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_lifetime_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_lifetime_p90_seconds_by_pod: histogram_quantile(0.9, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_lifetime_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_lifetime_p99_seconds_by_pod: histogram_quantile(0.99, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_lifetime_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_idle_before_evict_p50_seconds_by_pod: histogram_quantile(0.5, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_idle_before_evict_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_idle_before_evict_p90_seconds_by_pod: histogram_quantile(0.9, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_idle_before_evict_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_idle_before_evict_p99_seconds_by_pod: histogram_quantile(0.99, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_idle_before_evict_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_reuse_gap_p50_seconds_by_pod: histogram_quantile(0.5, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_reuse_gap_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_reuse_gap_p90_seconds_by_pod: histogram_quantile(0.9, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_reuse_gap_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_block_reuse_gap_p99_seconds_by_pod: histogram_quantile(0.99, sum by (pod, le) (rate({__name__=~"(vllm|kserve_vllm):kv_block_reuse_gap_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    cache_config_info: '{__name__=~"(vllm|kserve_vllm):cache_config_info", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
