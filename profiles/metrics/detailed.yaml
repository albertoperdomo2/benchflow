    storage_nvme_bytes_per_second_by_node_device: >-
      sum by (node, mountpoint, device, direction) (
        (
          label_replace(label_replace(rate(node_disk_read_bytes_total{device=~"nvme.*"}[5m]), "direction", "read", "__name__", ".*"), "node", "$1", "instance", "([^:]+)(:.*)?")
          or label_replace(label_replace(rate(node_disk_written_bytes_total{device=~"nvme.*"}[5m]), "direction", "write", "__name__", ".*"), "node", "$1", "instance", "([^:]+)(:.*)?")
        )
        * on (node, device) group_left(mountpoint)
          label_replace(label_replace((node_filesystem_size_bytes{mountpoint=~"$hostpath_mount_regex", device=~"/dev/nvme.*|nvme.*", fstype!~"$hostpath_filesystem_exclude_regex"} > bool 0), "device", "$2", "device", "(.*/)?([^/]+)$"), "node", "$1", "instance", "([^:]+)(:.*)?")
        * on (node) group_left
          max by (node) (kube_pod_info{namespace="$namespace", pod=~"$modelserver_pod_regex"})
      )
    storage_nvme_iops_by_node_device: >-
      sum by (node, mountpoint, device, direction) (
        (
          label_replace(label_replace(rate(node_disk_reads_completed_total{device=~"nvme.*"}[5m]), "direction", "read", "__name__", ".*"), "node", "$1", "instance", "([^:]+)(:.*)?")
          or label_replace(label_replace(rate(node_disk_writes_completed_total{device=~"nvme.*"}[5m]), "direction", "write", "__name__", ".*"), "node", "$1", "instance", "([^:]+)(:.*)?")
        )
        * on (node, device) group_left(mountpoint)
          label_replace(label_replace((node_filesystem_size_bytes{mountpoint=~"$hostpath_mount_regex", device=~"/dev/nvme.*|nvme.*", fstype!~"$hostpath_filesystem_exclude_regex"} > bool 0), "device", "$2", "device", "(.*/)?([^/]+)$"), "node", "$1", "instance", "([^:]+)(:.*)?")
        * on (node) group_left
          max by (node) (kube_pod_info{namespace="$namespace", pod=~"$modelserver_pod_regex"})
