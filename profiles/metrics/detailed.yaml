apiVersion: benchflow.io/v1alpha1
kind: MetricsProfile
metadata:
  name: detailed
spec:
  prometheus_url: https://thanos-querier.openshift-monitoring.svc:9091
  query_step: 15s
  query_timeout: 30s
  verify_tls: false
  queries:
    active_pods: count(kube_pod_info{namespace="$namespace", pod=~".*$release.*"})
    avg_gpu_utilization: avg(DCGM_FI_DEV_GPU_UTIL{exported_namespace="$namespace", exported_pod=~".*$release.*"})
    avg_cpu_usage_percent: avg(rate(container_cpu_usage_seconds_total{namespace="$namespace", pod=~".*$release.*"}[5m])) * 100
    avg_memory_working_set_bytes: avg(container_memory_working_set_bytes{namespace="$namespace", pod=~".*$release.*"})
    prompt_tokens_total: '{__name__=~"(vllm|kserve_vllm):prompt_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
    generation_tokens_total: '{__name__=~"(vllm|kserve_vllm):generation_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
    prompt_token_rate_per_second: rate({__name__=~"(vllm|kserve_vllm):prompt_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])
    prompt_tokens_rate_by_source: sum by (pod, source) (rate({__name__=~"(vllm|kserve_vllm):prompt_tokens_by_source_total", namespace="$namespace", pod=~"$modelserver_pod_regex", source=~"local_compute|local_cache_hit|external_kv_transfer"}[5m]))
    generation_token_rate_per_second: rate({__name__=~"(vllm|kserve_vllm):generation_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])
    generation_token_rate_sum_per_second: sum(rate({__name__=~"(vllm|kserve_vllm):generation_tokens_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    request_success_rate_by_pod: sum by (pod) (rate({__name__=~"(vllm|kserve_vllm):request_success_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    num_requests_running: '{__name__=~"(vllm|kserve_vllm):num_requests_running", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
    num_requests_waiting: '{__name__=~"(vllm|kserve_vllm):num_requests_waiting", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
    requests_running_waiting: max by (pod, state) (label_replace({__name__=~"(vllm|kserve_vllm):num_requests_running", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "state", "running", "__name__", ".*") or label_replace({__name__=~"(vllm|kserve_vllm):num_requests_waiting", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "state", "waiting", "__name__", ".*"))
    requests_waiting_by_reason: max by (pod, reason) ({__name__=~"(vllm|kserve_vllm):num_requests_waiting_by_reason", namespace="$namespace", pod=~"$modelserver_pod_regex"} or label_replace({__name__=~"(vllm|kserve_vllm):num_requests_waiting", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "reason", "unspecified", "__name__", ".*"))
    e2e_request_latency_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    e2e_request_latency_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    e2e_request_latency_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):e2e_request_latency_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    ttft_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    ttft_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    ttft_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    tpot_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):request_time_per_output_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    tpot_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):request_time_per_output_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    tpot_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):request_time_per_output_token_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    prefill_time_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):request_prefill_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    prefill_time_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):request_prefill_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    prefill_time_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):request_prefill_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    decode_time_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):request_decode_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    decode_time_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):request_decode_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    decode_time_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):request_decode_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    queue_time_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):request_queue_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    queue_time_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):request_queue_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    queue_time_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):request_queue_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    inference_time_p50_seconds: histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):request_inference_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    inference_time_p90_seconds: histogram_quantile(0.9, sum(rate({__name__=~"(vllm|kserve_vllm):request_inference_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    inference_time_p99_seconds: histogram_quantile(0.99, sum(rate({__name__=~"(vllm|kserve_vllm):request_inference_time_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) by (le))
    kv_cache_usage_percent: '{__name__=~"(vllm|kserve_vllm):kv_cache_usage_perc", namespace="$namespace", pod=~"$modelserver_pod_regex"}'
    prefix_cache_hit_rate: sum(rate({__name__=~"(vllm|kserve_vllm):prefix_cache_hits(_total)?", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum(rate({__name__=~"(vllm|kserve_vllm):prefix_cache_queries(_total)?", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 1)
    kv_offload_bytes_total_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}, "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_bytes_rate_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_time_rate_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_seconds_per_gib_by_pod: >-
      sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ) / clamp_min(sum by (pod, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ) / 1024 / 1024 / 1024, 0.001)
    kv_offload_transfer_bytes_rate_by_engine: >-
      sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_transfer_bandwidth_by_engine: >-
      sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ) / clamp_min(sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ), 0.001)
    kv_offload_transfer_ops_rate_by_engine: >-
      sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_size_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_size_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      )
    kv_offload_transfer_mean_seconds_by_engine: >-
      sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_time_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ) / clamp_min(sum by (pod, engine, transfer_type) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_size_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_size_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ), 0.001)
    kv_offload_transfer_size_p90_bytes_by_engine: >-
      histogram_quantile(0.9, sum by (pod, engine, transfer_type, le) (
        label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_load_size_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "CPU_to_GPU", "__name__", ".*")
        or label_replace(rate({__name__=~"(vllm|kserve_vllm):kv_offload_store_size_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]), "transfer_type", "GPU_to_CPU", "__name__", ".*")
      ))
    kv_offload_load_to_store_byte_ratio_by_engine: sum by (pod, engine) (increase({__name__=~"(vllm|kserve_vllm):kv_offload_load_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (increase({__name__=~"(vllm|kserve_vllm):kv_offload_store_bytes_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 1)
    kv_offload_tiering_lookup_async_stall_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_tiering_lookup_async_blocked_requests_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_sum", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_tiering_lookup_async_mean_seconds_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_sum", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 0.001)
    kv_offload_tiering_lookup_async_p50_seconds_by_engine: histogram_quantile(0.5, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_tiering_lookup_async_p90_seconds_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_tiering_lookup_async_p99_seconds_by_engine: histogram_quantile(0.99, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_tiering_lookup_async_overflow_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex", le="+Inf"}[5m]) - ignoring(le) rate({__name__=~"(vllm|kserve_vllm):kv_offload_tiering_lookup_async_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex", le="10"}[5m]))
    # ABC clean-prefetch lifecycle and critical-path costs. Preserve cumulative
    # totals for exact run accounting and rates for native 15-second plots.
    # The status-labelled chunk counter includes candidate, source_resident,
    # redundant, source_miss, submitted, capacity, promoted, late, useful,
    # wasted, load_failed, cancellation, and eviction/regret outcomes.
    kv_offload_prefetch_intents_total_by_engine: sum by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_intents_total", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_prefetch_intents_rate_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_intents_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_prefetch_chunks_total_by_engine_status: sum by (pod, engine, status) ({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_chunks_total", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_prefetch_chunks_rate_by_engine_status: sum by (pod, engine, status) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_chunks_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_prefetch_tracked_chunks_by_engine: max by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_tracked_chunks", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_prefetch_admission_p90_seconds_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_admission_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_probe_p90_seconds_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_probe_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_apply_p90_seconds_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_apply_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_ready_p90_seconds_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_ready_delay_seconds_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    # Request-level oracle metrics answer the real performance question: was
    # the complete bounded external working set ready at first demand lookup?
    kv_offload_prefetch_requests_total_by_engine_status: sum by (pod, engine, status) ({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_requests_total", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_prefetch_requests_rate_by_engine_status: sum by (pod, engine, status) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_requests_total", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m]))
    kv_offload_prefetch_active_requests_by_engine: max by (pod, engine) ({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_active_requests", namespace="$namespace", pod=~"$modelserver_pod_regex"})
    kv_offload_prefetch_request_target_chunks_mean_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_target_chunks_sum", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_target_chunks_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 0.001)
    kv_offload_prefetch_request_target_chunks_p50_by_engine: histogram_quantile(0.5, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_target_chunks_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_request_target_chunks_p90_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_target_chunks_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_request_ready_chunks_mean_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_ready_chunks_sum", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_ready_chunks_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 0.001)
    kv_offload_prefetch_request_ready_chunks_p50_by_engine: histogram_quantile(0.5, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_ready_chunks_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_request_ready_chunks_p90_by_engine: histogram_quantile(0.9, sum by (pod, engine, le) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_ready_chunks_bucket", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])))
    kv_offload_prefetch_request_coverage_mean_by_engine: sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_coverage_sum", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])) / clamp_min(sum by (pod, engine) (rate({__name__=~"(vllm|kserve_vllm):kv_offload_prefetch_request_coverage_count", namespace="$namespace", pod=~"$modelserver_pod_regex"}[5m])), 0.001)
