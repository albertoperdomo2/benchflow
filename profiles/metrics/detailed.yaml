        label_replace(label_replace(node_filesystem_avail_bytes{mountpoint=~"$hostpath_mount_regex", device=~"/dev/nvme.*|nvme.*", fstype!~"$hostpath_filesystem_exclude_regex"}, "device", "$2", "device", "(.*/)?([^/]+)$"), "node", "$1", "instance", "([^:]+)(:.*)?")
        * on (node) group_left
          max by (node) (kube_pod_info{namespace="$namespace", pod=~"$modelserver_pod_regex"})
      )
    storage_nvme_filesystem_usage_percent_by_node_mount: >-
