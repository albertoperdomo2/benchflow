apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: llm-d-optimized-baseline-scalability-cpu-offload
spec:
  platform: llm-d
  mode: inference-scheduling
  repo_url: https://github.com/llm-d/llm-d.git
  repo_ref: v0.9.0
  gateway: istio
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
    mount_path: /model-cache
  runtime:
    replicas: 1
    tensor_parallelism: 2
    env:
      USER: benchflow
      PYTHONHASHSEED: "0"
    # Match the RHOAI offloading profiles with a 256 GiB CPU tier.
    # Reserve enough pod memory for that tier in addition to model-server memory.
    shared_memory_size: 300Gi
    resources:
      requests:
        memory: 300Gi
      limits:
        memory: 400Gi
    vllm_args:
      - --gpu-memory-utilization=0.55
      - --trust-remote-code
      - --no-enable-log-requests
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":274877906944}}
