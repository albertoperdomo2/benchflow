apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: llm-d-optimized-baseline-scalability-nvme-offload
spec:
  platform: llm-d
  mode: inference-scheduling
  repo_url: https://github.com/llm-d/llm-d.git
  repo_ref: v0.9.0
  gateway: istio
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
    mount_path: /model-cache
  runtime:
    image: vllm/vllm-openai:v0.27.0
    replicas: 1
    tensor_parallelism: 2
    env:
      USER: benchflow
      # Replicas must derive identical filesystem-tier block names.
      PYTHONHASHSEED: "0"
    shared_memory_size: 300Gi
    resources:
      requests:
        memory: 300Gi
      limits:
        memory: 400Gi
    host_paths:
      # Provision this path on every GPU node as local XFS/NVMe storage. Bootstrap
      # installs the managed OpenShift SCC used for writable llm-d hostPath mounts.
      - name: nvme-kv-cache
        host_path: /var/mnt/benchflow-nvme/benchflow-kv-cache
        mount_path: /mnt/nvme-kv-cache
        type: DirectoryOrCreate
        read_only: false
        cleanup: true
    vllm_args:
      - --gpu-memory-utilization=0.55
      - --max-num-seqs=256
      - --trust-remote-code
      - --no-enable-log-requests
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      # Let vLLM derive the native chunk size from every KV cache group. A fixed
      # token block size is invalid for Qwen3.6's hybrid attention layout.
      - --kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":274877906944,"secondary_tiers":[{"type":"fs","root_dir":"/mnt/nvme-kv-cache","n_read_threads":16,"n_write_threads":16}]}}
