apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhaiis-kimi-k3-tp8-dp4-ep32
spec:
  platform: rhaiis
  mode: raw-vllm
  endpoint_path: /v1/models
  runtime:
    image: vllm/vllm-openai:kimi-k3
    service_account_name: benchflow-hostpath-runtime
    replicas: 4
    tensor_parallelism: 8
    host_paths:
      - name: kimi-k3-models
        host_path: /mnt/local/kimi-k3/models
        mount_path: /models
        type: Directory
        read_only: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - g13c364
                    - gc37d78
                    - gf2a612
                    - g1191e4
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: "16"
        memory: 64Gi
        ephemeral-storage: 50Gi
        rdma/ib: "1"
      limits:
        nvidia.com/gpu: "8"
        rdma/ib: "1"
    env:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_CACHE: /models/hf/hub
      TRANSFORMERS_OFFLINE: "1"
    vllm_args:
      - --data-parallel-size=4
      - --data-parallel-backend=mp
      - --enable-expert-parallel
      - --gpu-memory-utilization=0.95
      - --max-model-len=1048576
      - --max-num-seqs=8
      - --max-num-batched-tokens=4096
      - --attention-backend=FLASHMLA
      - --moe-backend=marlin
      - --enable-prefix-caching
      - --enforce-eager
      - --load-format=fastsafetensors
      - --language-model-only
      - --no-async-scheduling
      - --disable-custom-all-reduce
      - --enable-auto-tool-choice
      - --tool-call-parser=kimi_k3
      - --reasoning-parser=kimi_k3
      - >-
        --speculative-config={"method":"dspark","model":"Inferact/Kimi-K3-DSpark","num_speculative_tokens":2,"draft_sample_method":"probabilistic","rejection_sample_method":"synthetic","synthetic_acceptance_length":2.51}
  options:
    # /mnt/local/kimi-k3/models is mounted at /models on every selected node.
    model_path: /models
    distributed:
      enabled: true
      master_port: 29500
      host_network: true
      host_ipc: true
