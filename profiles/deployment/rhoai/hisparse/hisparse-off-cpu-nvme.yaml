apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhoai-hisparse-off-cpu-nvme
spec:
  # Matrix cell 3 of 6. HiSparse off, CPU tier + NVMe secondary tier.
  #
  # Identical to rhoai-hisparse-off-cpu except for secondary_tiers and the
  # hostPath mount that backs it. NVMe rather than CephFS: prior matrices found
  # NVMe and CephFS at parity on throughput while CephFS contributed a
  # store-refusal/backpressure tail that produced conditionally-valid cells.
  # NVMe keeps the secondary tier from becoming the story.
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.5.0
  platform_channel: stable-3.5
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    replicas: 1
    tensor_parallelism: 8
    tolerations:
      - key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Equal
        value: "true"
        effect: NoSchedule
    env:
      USER: benchflow
      VLLM_USE_V2_MODEL_RUNNER: "1"
      PYTHONHASHSEED: "0"
    # The 64 GiB CPU tier is one shared mmap per replica, divided among all TP
    # workers. Keep 16 GiB of alignment and runtime IPC headroom.
    shared_memory_size: 80Gi
    # Required for hostPath volumes on OpenShift. Bind this service account to
    # an SCC allowing hostPath and runtime/default seccomp; on Poseidon use
    # openshift-ai-llminferenceservice-multi-node-scc.
    service_account_name: benchflow-hostpath-runtime
    host_paths:
      # Pre-created on each node with mode 1777 so random non-root OpenShift
      # UIDs can write to it. Do not rely on DirectoryOrCreate: kubelet-created
      # hostPath directories are root-owned and may not be writable.
      #
      # The filesystem tier does not enforce byte capacity in vLLM config. Size
      # it by provisioning/quotaing the host directory. cleanup: true empties
      # the mount before release deletion; stale tier files are never reused by
      # a later engine and would otherwise pollute the next cell.
      - name: nvme-kv-cache
        host_path: /var/mnt/benchflow-nvme/benchflow-kv-cache
        mount_path: /mnt/nvme-kv-cache
        type: Directory
        read_only: false
        cleanup: true
    vllm_args:
      - --max-model-len=131072
      # Keep secondary_tiers[].root_dir in sync with host_paths[].mount_path.
      - --kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":68719476736,"eviction_policy":"lru","secondary_tiers":[{"type":"fs","root_dir":"/mnt/nvme-kv-cache","n_read_threads":64,"n_write_threads":64}]}}
      - --trust-remote-code
      - --no-enable-log-requests
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --kv-cache-metrics
      - --kv-cache-metrics-sample=0.01
  options:
    enable_auth: false
    startup_probe:
      # Allow slow 141-shard model loads to finish without leaking the shared
      # offload mmap through a probe-triggered container restart.
      failureThreshold: 540
      periodSeconds: 10
      timeoutSeconds: 10
