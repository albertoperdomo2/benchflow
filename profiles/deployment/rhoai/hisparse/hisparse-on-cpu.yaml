apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhoai-hisparse-on-cpu
spec:
  # Matrix cell 5 of 6. HiSparse on, OffloadingConnector CPU tier only.
  #
  # kv_connector is a single field, so stacking two connectors goes through
  # MultiConnector: kv_connector_extra_config.connectors is a list of the same
  # {kv_connector, kv_role, kv_connector_extra_config} dicts that would
  # otherwise sit at top level.
  #
  # IMPORTANT ASYMMETRY. The OffloadingConnector child below is real and
  # running, but it does NOT see the same data it sees in cell 2. When HiSparse
  # is active, vLLM narrows the offloader to the HISPARSE_INDEXER group only
  # (get_offloading_group_ids in
  # vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py):
  #
  #   HiSparse off -> all prefix-cacheable groups (MLA latent KV + indexer KV)
  #   HiSparse on  -> indexer KV only
  #
  # The indexer K cache is quantized and much smaller than the MLA latent cache.
  # So the offload column carries an order of magnitude less traffic in this
  # row. Consequences for analysis:
  #   - the offload factor has NO readable main effect across the two rows
  #   - do not compute an interaction term
  #   - cell 2 vs cell 5 is not a comparison
  # Valid reads: 1->2->3 (prefix offload depth), 1->4 (HiSparse effect),
  # 4->5->6 (indexer-offload increment on top of HiSparse).
  #
  # HOST RAM. This cell allocates BOTH the 64 GiB pinned HiSparse pool and the
  # TieringOffloadingSpec shared mmap in /dev/shm. Confirm the node has headroom
  # for 64 GiB pinned + up to 80 GiB tmpfs + model load before running.
  # vLLM raises at startup if the pinned pool does not fit; the nastier failure
  # is silent memory pressure that invalidates the run without an error.
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.5.0
  platform_channel: stable-3.5
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    replicas: 1
    tensor_parallelism: 8
    tolerations:
      - key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Equal
        value: "true"
        effect: NoSchedule
    env:
      USER: benchflow
      VLLM_USE_V2_MODEL_RUNNER: "1"
      PYTHONHASHSEED: "0"
    # The 64 GiB CPU tier is one shared mmap per replica, divided among all TP
    # workers. HiSparse's separate 64 GiB pool is pinned host memory.
    shared_memory_size: 80Gi
    vllm_args:
      - --max-model-len=131072
      # host_pool_gib matches cells 4 and 6; cpu_bytes_to_use, eviction_policy
      # and spec_name match cells 2, 3 and 6.
      - --kv-transfer-config={"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"HiSparseConnector","kv_role":"kv_both","kv_connector_extra_config":{"host_pool_gib":64}},{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":68719476736,"eviction_policy":"lru","secondary_tiers":[]}}]}}
      - --trust-remote-code
      - --no-enable-log-requests
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --kv-cache-metrics
      - --kv-cache-metrics-sample=0.01
  options:
    enable_auth: false
    startup_probe:
      # Allow slow 141-shard model loads to finish without leaking the shared
      # offload mmap through a probe-triggered container restart.
      failureThreshold: 540
      periodSeconds: 10
      timeoutSeconds: 10
