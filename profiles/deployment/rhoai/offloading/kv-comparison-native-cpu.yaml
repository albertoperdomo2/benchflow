apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhoai-kv-comparison-native-cpu
spec:
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.5.0
  platform_channel: stable-3.5
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    # CI builds the same serving image for every comparison arm.
    image: ghcr.io/albertoperdomo2/benchflow:lmcache-vllm0.32.0-lmcache0.5.7
    replicas: 1
    tensor_parallelism: 1
    shared_memory_size: 80Gi
    resources:
      requests:
        memory: 80Gi
      limits:
        memory: 96Gi
    env:
      USER: benchflow
      PYTHONHASHSEED: "0"
    vllm_args:
      - --max-model-len=8192
      - --block-size=16
      - --gpu-memory-utilization=0.55
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - '--kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":68719476736,"block_size":256}}'
  options:
    enable_auth: false
