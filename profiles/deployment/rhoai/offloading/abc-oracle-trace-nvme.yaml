apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: abc-oracle-trace-nvme
spec:
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.5.0
  platform_channel: stable-3.5
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    replicas: 1
    tensor_parallelism: 8
    env:
      USER: benchflow
    shared_memory_size: 300Gi
    service_account_name: benchflow-hostpath-runtime
    host_paths:
      - name: nvme-kv-cache
        host_path: /var/mnt/benchflow-nvme/benchflow-kv-cache
        mount_path: /mnt/nvme-kv-cache
        type: Directory
        read_only: false
        cleanup: true
    artifact_directories:
      - name: oracle-trace
        path: /tmp/vllm-kv-oracle-traces
    vllm_args:
      - --max-model-len=131072
      - --kv-transfer-config={"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":274877906944,"oracle_trace_dir":"/tmp/vllm-kv-oracle-traces","secondary_tiers":[{"type":"fs","root_dir":"/mnt/nvme-kv-cache","n_read_threads":64,"n_write_threads":64}]}}
      - --trust-remote-code
      - --no-enable-log-requests
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --kv-cache-metrics
      - --kv-cache-metrics-sample=0.01
  options:
    enable_auth: false
