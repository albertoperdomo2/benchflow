apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhoai-lmcache-smoke
spec:
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.6.0-ea.2
  platform_channel: beta
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    # Supply the vLLM+LMCache image through runtime.image or --runtime-image.
    image: ""
    replicas: 1
    tensor_parallelism: 1
    shared_memory_size: 1Gi
    resources:
      requests:
        memory: 8Gi
      limits:
        memory: 12Gi
    env:
      USER: benchflow
      PYTHONHASHSEED: '0'
    vllm_args:
    - --max-model-len=1024
    - --block-size=16
    - --dtype=bfloat16
    - --kv-cache-memory-bytes=134217728
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
  options:
    enable_auth: false
    lmcache:
      cpu_gib: 1
      chunk_size: 256
      verify_readback: true
