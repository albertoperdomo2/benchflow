apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhoai-lmcache-cpu-256g
spec:
  platform: rhoai
  mode: distributed-default
  platform_version: RHOAI-3.5.0
  platform_channel: stable-3.5
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
  runtime:
    image: ""
    replicas: 1
    tensor_parallelism: 2
    shared_memory_size: 300Gi
    node_selector:
      kubernetes.io/hostname: diadochos-hqxzk-gpu-h100-mt46x
    resources:
      requests:
        memory: 64Gi
      limits:
        memory: 512Gi
    env:
      USER: benchflow
      PYTHONHASHSEED: "0"
      HOME: /tmp
    vllm_args:
    - --max-model-len=131072
    - --trust-remote-code
    - --no-enable-log-requests
    - --enable-prefix-caching
    - --enable-prompt-tokens-details
  options:
    enable_auth: false
    lmcache:
      cpu_gib: 256
      chunk_size: 256
      verify_readback: true
