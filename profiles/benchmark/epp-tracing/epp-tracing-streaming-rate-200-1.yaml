apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: guidellm-epp-tracing-streaming-rate-200-1
spec:
  guidellm:
    backend:
      kind: openai_http
      stream: true
    profile:
      kind: poisson
      max_concurrency: 512
    override:
      profile.rate: [100]
    metrics:
      kind: generative
      sample_size: 100
    seed:
      kind: static
      value: 20260919
    data:
      kind: synthetic_text
      prompt_tokens: 200
      output_tokens: 1
    constraint:
      - kind: max_duration
        seconds: 300
