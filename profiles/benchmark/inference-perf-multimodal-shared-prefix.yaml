apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: inference-perf-multimodal-shared-prefix
spec:
  tool: inference-perf
  requirements:
    # 3x 720p images add roughly 3.6K visual tokens to the 1.3K text prompt.
    min_max_model_len: 8192
  inference_perf:
    # Native Inference Perf configuration. BenchFlow injects server.model_name,
    # server.base_url, tokenizer.pretrained_model_name_or_path, and local storage.
    config:
      api:
        type: chat
        streaming: true
      load:
        type: constant
        interval: 60.0
        request_timeout: 300
        stages:
          # Warm the shared prefixes and the predicted-latency model first.
          - rate: 5
            duration: 600
          - rate: 5
            duration: 100
          - rate: 10
            duration: 100
          - rate: 15
            duration: 100
          - rate: 20
            duration: 100
          - rate: 25
            duration: 100
          - rate: 30
            duration: 100
          - rate: 35
            duration: 100
          - rate: 40
            duration: 100
      data:
        type: shared_prefix
        shared_prefix:
          multimodal:
            image:
              count:
                type: fixed
                min: 3
                max: 3
                mean: 3
              insertion_point: 0.0
              resolutions:
                - resolution: 720p
                  weight: 1
          num_groups: 600
          num_prompts_per_group: 5
          system_prompt_len: 100
          question_len: 1200
          output_len: 300
          enable_multi_turn_chat: false
      report:
        request_lifecycle:
          summary: true
          per_stage: true
          per_request: true
