apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: guidellm-lmcache-smoke
spec:
  guidellm:
    backend:
      kind: openai_http
    profile:
      kind: concurrent
    override:
      profile.streams: [1]
    seed:
      kind: static
      value: 42
    data:
      kind: synthetic_text
      prompt_tokens: 64
      output_tokens: 16
      turns: 1
      prefix_buckets:
        - bucket_weight: 100
          prefix_tokens: 768
          prefix_count: 2
    constraint:
      - kind: max_requests
        count: 24
      - kind: max_duration
        seconds: 180
    tokenizer:
      kind: huggingface_auto
  env:
    GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL: INFO
