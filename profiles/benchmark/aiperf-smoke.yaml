apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: aiperf-smoke
spec:
  tool: aiperf
  env:
    AIPERF_HTTP_SSL_VERIFY: "false"
  aiperf:
    # A tiny synthetic workload avoids external dataset downloads while still
    # exercising AIPerf's summary and per-request artifact exporters.
    endpoint_type: chat
    endpoint_path: /v1/chat/completions
    streaming: true
    synthetic_input_tokens_mean: 64
    synthetic_input_tokens_stddev: 0
    output_tokens_mean: 16
    output_tokens_stddev: 0
    request_count: 10
    concurrency: 2
    export_level: records
    tokenizer_trust_remote_code: true
    ui: simple
    max_seconds: 600
