name: Build LMCache Serving Image

on:
  pull_request:
    paths:
      - '.github/workflows/build-lmcache-image.yaml'
      - 'build/Containerfile.lmcache'
      - 'src/benchflow/lmcache.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lmcache-image.yaml'
      - 'build/Containerfile.lmcache'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Free runner disk for CUDA serving image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set image tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REPOSITORY="ghcr.io/${OWNER,,}/benchflow"
          SHA="$(git rev-parse --short=7 HEAD)"
          if [[ -n "${PR_NUMBER}" ]]; then
            TAG="lmcache-pr-${PR_NUMBER}-${SHA}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAG="lmcache-vllm0.32.0-lmcache0.5.7"
          else
            TAG="lmcache-test-${SHA}"
          fi
          echo "image=${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: build/Containerfile.lmcache
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.image }}
          provenance: false

      - name: Image and smoke-test instructions
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## LMCache serving image'
            echo "Image: \`${IMAGE}\`"
            echo "Digest: \`${DIGEST}\`"
            echo 'Run with the BenchFlow control image built for the same PR:'
            echo '```bash'
            echo "bflow experiment run experiments/smoke/qwen3-06b-rhoai-lmcache-smoke.yaml --runtime-image ${IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
