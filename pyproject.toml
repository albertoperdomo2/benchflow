[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchflow"
version = "0.1.0"
description = "BenchFlow control plane for llm inference benchmarking"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "click>=8.1.0",
  "Jinja2>=3.1.0",
  "requests>=2.31.0",
  "boto3>=1.26.0",
  "pandas>=1.5.0",
  "plotly>=5.11.0",
  "mlflow==3.12.0",
  "certifi==2025.7.9",
  "datasets==4.8.4",
  "mistral-common",
  "rich>=13.9.0",
]

[project.optional-dependencies]
aiperf = [
  "aiperf @ git+https://github.com/ai-dynamo/aiperf.git@ajc/agentx",
]
inference-perf = [
  "inference-perf @ git+https://github.com/kubernetes-sigs/inference-perf.git@f6c714bb479fea4cedf1e088b04d81a4d0e76fa2",
]
dev = [
  "pre-commit>=3.7.0",
  "ruff>=0.8.0",
]

[project.scripts]
bflow = "benchflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"benchflow" = ["assets/**/*.yaml", "assets/**/*.json", "assets/**/*.j2"]
"benchflow.benchmark.processor" = ["config/*.yaml"]
