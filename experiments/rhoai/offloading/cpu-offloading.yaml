apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: cpu-offloading
spec:
  model:
    name:
      # - deepseek-ai/DeepSeek-V4-Flash
      # - Qwen/Qwen3.6-35B-A3B
      # - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
      # - google/gemma-4-31B-it
      # - RedHatAI/Llama-3_1-Nemotron-Ultra-253B-v1
      - nvidia/Llama-3_1-Nemotron-Ultra-253B-v1-FP8
  deployment_profile: 
    # - cpu-kv-offload-distributed-default
    # - rhoai-cpu-kv-offload-64g
    # - rhoai-cpu-kv-offload-160g
    # - rhoai-cpu-kv-offload-256g
    # - rhoai-cpu-kv-offload-256g-prefetch
    # - rhoai-cpu-kv-offload-512g
    - multi-tier-offloading-nvme
    # - multi-tier-offloading-cephfs
  benchmark_profile:
    - aiperf-agentx-inference
    # - cpu-offloading-short-context
    # - cpu-offloading-long-output
    # - cpu-offloading-long-context
  model_overrides:
    nvidia/Llama-3_1-Nemotron-Ultra-253B-v1-FP8:
      scale:
        tensor_parallelism: 8
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.8
          # Force a server-side waiting queue for the admission-prefetch PoC.
          - --max-num-seqs=1
    RedHatAI/Llama-3_1-Nemotron-Ultra-253B-v1:
      scale:
        tensor_parallelism: 8
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.9
    deepseek-ai/DeepSeek-V4-Flash:
      scale:
        tensor_parallelism: 8
        replicas: 1
      runtime:
        vllm_extra_args:
          - --kv-cache-dtype=fp8
          - --gpu-memory-utilization=0.65
    nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8:
      scale:
        tensor_parallelism: 4
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.65
    Qwen/Qwen3.6-35B-A3B:
      scale:
        tensor_parallelism: 2
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.55
          - --max-num-seqs=256
    google/gemma-4-31B-it:
      scale:
        tensor_parallelism: 2
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.92
  overrides:
    images:
      runtime: quay.io/rh-ee-aperdomo/vllm:v0.27.0-prefetch-p1 # vllm/vllm-openai:v0.27.0 # v0.25.1
    runtime:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # - diadochos-hqxzk-gpu-h100-gjfjh
                      - diadochos-hqxzk-gpu-h100-6kl5z
                      # - diadochos-hqxzk-gpu-h100-fx7c8
      # placement:
        # mode: sequential
  metrics_profile: detailed
  mlflow:
    tags:
      accelerator: H100
  namespace: benchflow
  execution:
    timeout: 8h
