apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: rhoai-lookahead
spec:
  model:
    name:
      - nvidia/Llama-3_1-Nemotron-Ultra-253B-v1-FP8
  deployment_profile:
    - multi-tier-offloading-nvme
    - multi-tier-offloading-nvme-lookahead
  benchmark_profile:
    - aiperf-agentx-inference
  model_overrides:
    nvidia/Llama-3_1-Nemotron-Ultra-253B-v1-FP8:
      scale:
        tensor_parallelism: 8
        replicas: 1
      runtime:
        vllm_extra_args:
          - --gpu-memory-utilization=0.8
  overrides:
    images:
      runtime: quay.io/rh-ee-aperdomo/vllm:v0.27.0-lookahead-v3
    benchmark:
      concurrency: 64
  metrics_profile: detailed
  mlflow:
    tags:
      accelerator: H100
      revision: v0.27.0-lookahead-v2
  namespace: benchflow
  execution:
    timeout: 8h
