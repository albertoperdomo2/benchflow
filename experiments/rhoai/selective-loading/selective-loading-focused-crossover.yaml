apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: llm-d-selective-loading-focused-crossover
spec:
  model:
    name:
      - Qwen/Qwen3-32B
  deployment_profile:
    - multi-tier-offloading-nvme
    - rhoai-distributed-default-selective-loading-disabled
  benchmark_profile:
    - guidellm-selective-loading-calibration-p1024-c16
    - guidellm-selective-loading-calibration-p1024-c32
    - guidellm-selective-loading-calibration-p1024-c64
    - guidellm-selective-loading-calibration-p2048-c16
    - guidellm-selective-loading-calibration-p2048-c32
    - guidellm-selective-loading-calibration-p2048-c64
    - guidellm-selective-loading-calibration-p4096-c16
    - guidellm-selective-loading-calibration-p4096-c32
    - guidellm-selective-loading-calibration-p4096-c64
    - guidellm-selective-loading-calibration-p8192-c16
    - guidellm-selective-loading-calibration-p8192-c32
    - guidellm-selective-loading-calibration-p8192-c64
  overrides:
    images:
      runtime: quay.io/rh-ee-aperdomo/vllm:v0.27.0-selective-load-v1
      scheduler: quay.io/rh-ee-aperdomo/llm-d-router-endpoint-picker:dev-0a55d5da
    scale:
      replicas: 4
      tensor_parallelism: 2
    runtime:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - diadochos-hqxzk-gpu-h100-mt46x
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: llminferenceservice
                  kserve.io/component: workload
              matchLabelKeys:
                - app.kubernetes.io/name
      placement:
        mode: sequential
  metrics_profile: detailed
  target:
    endpoint_scope: external
  mlflow:
    tags:
      accelerator: H100
      benchmark_family: selective-loading-focused-crossover
      revision: v0.27.0-selective-load-v1
      prefix_corpus_tokens: "2097152"
      turns: "1"
      calibration_node: diadochos-hqxzk-gpu-h100-mt46x
  namespace: benchflow
  execution:
    timeout: 16h

