apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: epp-tracing-overhead-live
spec:
  model:
    name: Qwen/Qwen3-0.6B
  deployment_profile: llm-d-optimized-baseline-scalability
  benchmark_profile: guidellm-epp-tracing-rate-400-200-100
  metrics_profile:
    - epp-tracing-off
    - epp-tracing-one-percent
    - epp-tracing-ten-percent
    - epp-tracing-full
    # CPU profiling adds request latency. Use this run to attribute CPU cost,
    # not as a request-performance sample for 100% tracing.
    - epp-tracing-full-pprof
  namespace: benchflow
  model_overrides:
    Qwen/Qwen3-0.6B:
      scale:
        tensor_parallelism: 1
        replicas: 8
  mlflow:
    experiment: epp-tracing-overhead
    tags:
      issue: llm-d-router#2665
      study_phase: live-fixed-400
  execution:
    timeout: 4h
