apiVersion: benchflow.io/v1alpha1
kind: Experiment
metadata:
  name: qwen36-35b-nvme-offloading-scalability
spec:
  model:
    name:
      - Qwen/Qwen3.6-35B-A3B
  deployment_profile:
    - llm-d-optimized-baseline-scalability-nvme-offload
  benchmark_profile:
    - aiperf-agentx-inference
  overrides:
    scale:
      replicas: [1, 2, 4, 8]
    benchmark:
      concurrency: [4, 8, 16, 32, 64, 128, 256, 512, 1024]
    runtime:
      # Each child owns whole nodes, isolating the fixed host NVMe directory
      # while allowing children with disjoint node sets to run in parallel.
      placement:
        mode: node-exclusive
        spread_pool: h100-benchflow
  metrics_profile: detailed
  target:
    # External Gateway traffic exercises the upstream EPP routing path.
    endpoint_scope: external
  mlflow:
    tags:
      benchmark_family: qwen35-offload-scalability
      llm_d_release: v0.9.0
      offload_type: local-nvme
  namespace: benchflow
  execution:
    timeout: 8h
